<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --ink:#e6edf3;
    --dim:#8b949e; --accent:#58a6ff; --good:#3fb950; --bad:#f85149; --warn:#d29922;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 20px 64px}
  h1{font-size:30px;line-height:1.25;margin:0 0 8px;letter-spacing:-.01em}
  .sub{color:var(--dim);margin:0 0 28px;max-width:62ch}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 18px}
  label{display:block;font-size:14px;margin:0 0 6px}
  label b{font-variant-numeric:tabular-nums;color:var(--accent)}
  input[type=range]{width:100%;margin:0 0 4px;accent-color:var(--accent)}
  .row{margin-bottom:20px}
  .hint{font-size:12px;color:var(--dim);margin:2px 0 0}
  select,input[type=number]{background:#0d1117;color:var(--ink);border:1px solid var(--line);
    border-radius:6px;padding:6px 8px;font:inherit;font-size:14px;width:100%}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .presets button{background:#21262d;color:var(--ink);border:1px solid var(--line);border-radius:999px;
    padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
  .presets button:hover{border-color:var(--accent);color:var(--accent)}
  .big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.02em}
  .big.good{color:var(--good)} .big.bad{color:var(--bad)}
  .cap{font-size:13px;color:var(--dim);margin:2px 0 0}
  .stat{margin-bottom:22px}
  table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  th,td{padding:7px 0;border-bottom:1px solid var(--line);text-align:right}
  th:first-child,td:first-child{text-align:left;color:var(--dim);font-weight:400}
  th{color:var(--dim);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  td.good{color:var(--good)} td.bad{color:var(--bad)}
  .bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex;margin:6px 0 2px}
  .bar i{display:block;height:100%}
  .bar .used{background:var(--bad)} .bar .free{background:#238636}
  footer{margin-top:28px;font-size:13px;color:var(--dim)}
  code{background:#0d1117;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:13px}
  a{color:var(--accent)}
  .privacy{display:inline-block;margin-bottom:14px;font-size:12px;color:var(--good);
    border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .lang{position:absolute;top:18px;right:20px;font-size:13px;margin:0}
  .wrap{position:relative}
